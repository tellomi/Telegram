name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run it replaces.
concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  TELLOMI_CI_NATIVE: "1"
  TELLOMI_CCACHE: "1"
  TELLOMI_NINJA_COMPILE_JOBS: "2"
  TELLOMI_NINJA_LINK_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "1500M"
  CCACHE_SLOPPINESS: time_macros,file_macro,locale,include_file_mtime,include_file_ctime
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  native:
    name: Native ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/share/miniconda \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /opt/hostedtoolcache \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Add swap
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Select JDK 17
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "${JAVA_HOME_17_X64}/bin/java" ]; then
            echo "Preinstalled JDK 17 was not found (JAVA_HOME_17_X64=${JAVA_HOME_17_X64:-})" >&2
            ls -d /usr/lib/jvm/* 2>/dev/null || true
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          gradle-home-cache-excludes: |
            caches/build-cache-1/**

      - name: Install Android SDK, NDK, and CMake
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          else
            SDK=/usr/local/lib/android/sdk
          fi
          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK" >&2
            exit 1
          fi
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            find "$SDK" -maxdepth 3 -type d | head -80
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          if [ ! -d "$SDK/ndk/27.2.12479018" ]; then
            echo "NDK 27.2.12479018 was not installed" >&2
            ls -la "$SDK/ndk" || true
            exit 1
          fi
          test -x "$SDK/cmake/3.22.1/bin/cmake"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Install nasm and ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm ccache
          nasm -v
          ccache --version | head -1

      - name: Select build type
        id: variant
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "native_task=externalNativeBuildTellomiRelease" >> "$GITHUB_OUTPUT"
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
            echo "native_task=externalNativeBuildTellomiDebug" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.abi }}-${{ steps.variant.outputs.type }}-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            ccache-${{ matrix.abi }}-${{ steps.variant.outputs.type }}-ndk-27.2.12479018-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p .ccache
          ccache --set-config=max_size=1500M
          ccache --set-config=compression=true

      - name: Restore native library
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: tellomi-native-out/${{ matrix.abi }}/libtmessages.49.so
          key: tellomi-so-${{ matrix.abi }}-${{ steps.variant.outputs.type }}-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build ${{ matrix.abi }}
        if: steps.native-cache.outputs.cache-hit != 'true'
        env:
          NATIVE_TASK: ${{ steps.variant.outputs.native_task }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
          org.gradle.parallel=false
          org.gradle.workers.max=2
          org.gradle.vfs.watch=false
          org.gradle.daemon=true
          EOF
          set +e
          ./gradlew ":TMessagesProj:${NATIVE_TASK}" \
            -PTELLOMI_ABI_FILTERS="$ABI" \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m" \
            -Dorg.gradle.parallel=false \
            -Dorg.gradle.workers.max=2 \
            --stacktrace \
            --console=plain
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Native build failed (exit $status). CMake/native tasks on :TMessagesProj:"
            ./gradlew :TMessagesProj:tasks --all --console=plain | grep -Ei 'native|cmake|external' || true
            exit "$status"
          fi
          roots=()
          [ -d TMessagesProj/build ] && roots+=(TMessagesProj/build)
          [ -d TMessagesProj/.cxx ] && roots+=(TMessagesProj/.cxx)
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "Native build produced no output directory" >&2
            exit 1
          fi
          # head closes the pipe early; don't let pipefail fail the search.
          so=$(find "${roots[@]}" -path "*/${ABI}/*" -name 'libtmessages.49.so' -type f -printf '%s\t%p\n' | sort -nr | head -1 | cut -f2- || true)
          if [ -z "$so" ]; then
            echo "libtmessages.49.so not found for ${ABI}" >&2
            find TMessagesProj -name 'libtmessages.49.so' -type f || true
            exit 1
          fi
          mkdir -p "tellomi-native-out/${ABI}"
          cp -f "$so" "tellomi-native-out/${ABI}/libtmessages.49.so"
          file "tellomi-native-out/${ABI}/libtmessages.49.so"
          ls -lh "tellomi-native-out/${ABI}/libtmessages.49.so"
          ccache --show-stats || true
          df -h /

      - name: Save native library
        if: steps.native-cache.outputs.cache-hit != 'true' && success()
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tellomi-native-out/${{ matrix.abi }}/libtmessages.49.so
          key: tellomi-so-${{ matrix.abi }}-${{ steps.variant.outputs.type }}-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Upload ${{ matrix.abi }} library
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.abi }}-${{ steps.variant.outputs.type }}
          path: tellomi-native-out/${{ matrix.abi }}/libtmessages.49.so
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  apk:
    name: Package Tellomi APK
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get clean
          df -h /

      - name: Select JDK 17
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "${JAVA_HOME_17_X64}/bin/java" ]; then
            echo "Preinstalled JDK 17 was not found" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Select build type
        id: variant
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "type=release" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleAfatRelease" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import os, base64, pathlib, re
          raw = "".join(os.environ["ANDROID_KEYSTORE_BASE64"].split())
          data = base64.b64decode(raw)
          if len(data) < 16:
              raise SystemExit("decoded keystore is too small")
          pathlib.Path("TMessagesProj/config/release.keystore").write_bytes(data)

          def prop_escape(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\r", "").replace("\n", "")

          repl = {
              "RELEASE_STORE_PASSWORD": prop_escape(os.environ["ANDROID_KEYSTORE_PASSWORD"]),
              "RELEASE_KEY_ALIAS": prop_escape(os.environ["ANDROID_KEY_ALIAS"]),
              "RELEASE_KEY_PASSWORD": prop_escape(os.environ["ANDROID_KEY_PASSWORD"]),
          }
          path = pathlib.Path("gradle.properties")
          lines = []
          seen = set()
          for line in path.read_text().splitlines():
              match = re.match(r"^([A-Za-z0-9_.]+)=", line)
              if match and match.group(1) in repl:
                  lines.append(f"{match.group(1)}={repl[match.group(1)]}")
                  seen.add(match.group(1))
              else:
                  lines.append(line)
          for key, value in repl.items():
              if key not in seen:
                  lines.append(f"{key}={value}")
          path.write_text("\n".join(lines) + "\n")
          print(f"Installed release keystore ({len(data)} bytes)")
          PY
          else
            echo "type=debug" >> "$GITHUB_OUTPUT"
            echo "gradle_task=assembleAfatDebug" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not all set; building debug."
          fi

      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*-${{ steps.variant.outputs.type }}
          path: native-artifacts
          merge-multiple: false

      - name: Stage native libraries
        env:
          BUILD_TYPE: ${{ steps.variant.outputs.type }}
        run: |
          set -euo pipefail
          mkdir -p tellomi-jni
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            src="native-artifacts/native-${abi}-${BUILD_TYPE}/libtmessages.49.so"
            if [ ! -f "$src" ]; then
              echo "missing $src" >&2
              find native-artifacts -type f -print
              exit 1
            fi
            mkdir -p "tellomi-jni/${abi}"
            cp "$src" "tellomi-jni/${abi}/libtmessages.49.so"
            file "tellomi-jni/${abi}/libtmessages.49.so"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          gradle-home-cache-excludes: |
            caches/build-cache-1/**

      - name: Install Android SDK
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          else
            SDK=/usr/local/lib/android/sdk
          fi
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Assemble APK
        env:
          GRADLE_TASK: ${{ steps.variant.outputs.gradle_task }}
          BUILD_TYPE: ${{ steps.variant.outputs.type }}
          # Next afat versionCode above the shipped 72379. The ones digit is
          # the ABI marker (afat universal = 9). Each run adds 10.
          TELLOMI_VERSION_CODE_BASE: "72389"
        run: |
          set -euo pipefail
          # Manifest versionCode = APP_VERSION_CODE * 10 + abiVersionCode.
          # Checked-in APP_VERSION_CODE=7237 packages the afat APK as 72379,
          # so a new build could not install over v13.1.1-72379. -P overrides
          # gradle.properties for this job only.
          run="${GITHUB_RUN_NUMBER:?}"
          case "$run" in
            ''|*[!0-9]*) echo "GITHUB_RUN_NUMBER is not an integer: $run" >&2; exit 1 ;;
          esac
          base="${TELLOMI_VERSION_CODE_BASE:?}"
          manifest=$((base + run * 10))
          if [ "$manifest" -le 72379 ] || [ $((manifest % 10)) -ne 9 ]; then
            echo "refusing versionCode $manifest" >&2
            exit 1
          fi
          app_version_code=$(( (manifest - 9) / 10 ))
          if [ $((app_version_code * 10 + 9)) -ne "$manifest" ]; then
            echo "APP_VERSION_CODE $app_version_code does not encode versionCode $manifest" >&2
            exit 1
          fi
          file_code=$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties)
          if [ -z "$file_code" ] || [ "$app_version_code" -le "$file_code" ]; then
            echo "CI APP_VERSION_CODE $app_version_code is not above gradle.properties (${file_code:-missing})" >&2
            exit 1
          fi
          echo "versionCode: $manifest (APP_VERSION_CODE=$app_version_code, run=$run)" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
          org.gradle.parallel=true
          org.gradle.workers.max=4
          org.gradle.vfs.watch=false
          org.gradle.daemon=true
          EOF
          ./gradlew ":TMessagesProj_App:${GRADLE_TASK}" \
            -PAPP_VERSION_CODE="$app_version_code" \
            -PTELLOMI_PREBUILT_JNI="$GITHUB_WORKSPACE/tellomi-jni" \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            --stacktrace \
            --console=plain
          shopt -s nullglob
          apks=(TMessagesProj_App/build/outputs/apk/afat/"${BUILD_TYPE}"/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected one afat ${BUILD_TYPE} APK, found ${#apks[@]}" >&2
            find TMessagesProj_App/build/outputs/apk -name '*.apk' -print || true
            exit 1
          fi
          apk="${apks[0]}"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! unzip -l "$apk" | grep -q "lib/${abi}/libtmessages.49.so"; then
              echo "APK is missing lib/${abi}/libtmessages.49.so" >&2
              unzip -l "$apk" | grep 'libtmessages' || true
              exit 1
            fi
          done
          out="tellomi-${BUILD_TYPE}.apk"
          cp "$apk" "$out"
          aapt="${ANDROID_SDK_ROOT:?}/build-tools/36.0.0/aapt"
          if [ ! -x "$aapt" ]; then
            echo "aapt not found at $aapt" >&2
            exit 1
          fi
          badging=$("$aapt" dump badging "$out")
          packaged=$(printf '%s\n' "$badging" | sed -n "s/^package: .*versionCode='\([0-9][0-9]*\)'.*/\1/p")
          if [ "$packaged" != "$manifest" ]; then
            echo "APK versionCode '${packaged:-missing}' != $manifest" >&2
            printf '%s\n' "$badging" | head -n 1 >&2 || true
            exit 1
          fi
          bytes=$(stat -c '%s' "$out")
          echo "APK: $out" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Size: ${bytes} bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "versionCode: $packaged" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -lh "$out"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tellomi-${{ steps.variant.outputs.type }}
          path: tellomi-${{ steps.variant.outputs.type }}.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
