name: Tellomi UI tests

# Emulator UI coverage for the Tellomi Android backlog. Builds one x86_64 debug
# APK (assembleAfatDebug) and does not read the release keystore or publish.
# GitHub only lists workflow_dispatch after the file is on the default branch.
# The branch push below starts the suite on this PR without merging it.
on:
  push:
    branches:
      - cursor/android-ui-automation-9e5a
  workflow_dispatch:
    inputs:
      max_shards:
        description: "Emulator shards, 1 to 20"
        type: number
        default: 20
      scope:
        description: "all includes login with the dedicated 99966170xx numbers; logged-out skips the session"
        type: choice
        options:
          - all
          - logged-out
        default: all
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: tellomi-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TELLOMI_CI_NATIVE: "1"
  TELLOMI_CCACHE: "1"
  TELLOMI_NINJA_COMPILE_JOBS: "2"
  TELLOMI_NINJA_LINK_JOBS: "1"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: "1500M"
  CCACHE_SLOPPINESS: time_macros,file_macro,locale,include_file_mtime,include_file_ctime
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.write.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Unit tests
        run: python3 -m unittest discover -s tellomi/uitest/android/tests -v

      - name: Write plan
        id: write
        env:
          MAX_SHARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_shards || 20 }}
          SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'all' }}
          TELLOMI_TEST_PHONE_A: ${{ secrets.TELLOMI_TEST_PHONE_A }}
          TELLOMI_TEST_PHONE_B: ${{ secrets.TELLOMI_TEST_PHONE_B }}
          PLAN_OUT: plan/plan.json
        run: |
          set -euo pipefail
          mkdir -p plan
          python3 tellomi/uitest/android/scripts/plan_run.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("plan/plan.json").read_text())
          matrix = {"include": [{"shard": shard["name"], "api": str(shard["api"])} for shard in plan["shards"]]}
          if not matrix["include"]:
              raise SystemExit("plan produced no shards")
          if len(matrix["include"]) > 20:
              raise SystemExit("plan exceeded 20 shards")
          Path("plan/matrix.json").write_text(json.dumps(matrix))
          print("matrix shards:", ", ".join(item["shard"] + "@" + item["api"] for item in matrix["include"]))
          PY
          echo "matrix<<EOF" >> "$GITHUB_OUTPUT"
          cat plan/matrix.json >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload plan
        uses: actions/upload-artifact@v7
        with:
          name: ui-plan
          path: plan/plan.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build x86_64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Free disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/share/miniconda \
            /usr/local/share/chromium \
            /usr/local/share/vcpkg \
            /opt/hostedtoolcache \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Add swap
        run: |
          set -euo pipefail
          if ! swapon --show | grep -q .; then
            sudo fallocate -l 8G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          fi
          free -h

      - name: Select JDK 17
        run: |
          set -euo pipefail
          if [ -z "${JAVA_HOME_17_X64:-}" ] || [ ! -x "${JAVA_HOME_17_X64}/bin/java" ]; then
            echo "Preinstalled JDK 17 was not found" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper
          gradle-home-cache-excludes: |
            caches/build-cache-1/**

      - name: Install Android SDK, NDK, and CMake
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          elif [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          else
            SDK=/usr/local/lib/android/sdk
          fi
          SDKMANAGER=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          test -d "$SDK/ndk/27.2.12479018"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties

      - name: Restore native library
        id: native-cache
        uses: actions/cache/restore@v6
        with:
          path: tellomi-native-out/x86_64/libtmessages.49.so
          key: tellomi-so-x86_64-debug-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install nasm and ccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm ccache
          mkdir -p .ccache

      - name: Restore ccache
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-x86_64-debug-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle') }}
          restore-keys: |
            ccache-x86_64-debug-ndk-27.2.12479018-

      - name: Assemble debug APK
        run: bash tellomi/uitest/android/scripts/ci_build_apk.sh

      - name: Save native library
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: tellomi-native-out/x86_64/libtmessages.49.so
          key: tellomi-so-x86_64-debug-ndk-27.2.12479018-${{ hashFiles('TMessagesProj/jni/**', 'TMessagesProj/build.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tellomi-uitest-apk
          path: tellomi-uitest.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  test:
    name: Emulator ${{ matrix.shard }} API ${{ matrix.api }}
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      TELLOMI_TEST_PHONE_A: ${{ secrets.TELLOMI_TEST_PHONE_A }}
      TELLOMI_TEST_PHONE_B: ${{ secrets.TELLOMI_TEST_PHONE_B }}
      TELLOMI_TEST_PASSWORD: ${{ secrets.TELLOMI_TEST_PASSWORD }}
      PLAN: ${{ github.workspace }}/plan/plan.json
      APK: ${{ github.workspace }}/apk/tellomi-uitest.apk
      OUT: ${{ github.workspace }}/ui-shard-out
      SHARD: ${{ matrix.shard }}
      API_LEVEL: ${{ matrix.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: ui-plan
          path: plan

      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: tellomi-uitest-apk
          path: apk

      - name: Select JDK 17
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - name: Install Maestro
        run: |
          set -euo pipefail
          export MAESTRO_VERSION=2.12.1
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Enable KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "KVM is not available on this runner" >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm

      - name: Run shard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 2048
          disk-size: 6144
          disable-animations: true
          emulator-boot-timeout: 900
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -camera-back none -prop persist.sys.locale=zh-Hans-CN -prop persist.sys.language=zh -prop persist.sys.country=CN
          script: bash tellomi/uitest/android/scripts/ci_shard.sh

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-shard-${{ matrix.shard }}
          path: ui-shard-out
          if-no-files-found: warn
          retention-days: 14

  merge:
    name: Merge ui-results.json
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download plan
        uses: actions/download-artifact@v8
        with:
          name: ui-plan
          path: plan

      - name: Download shard results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: ui-shard-*
          path: shard-artifacts

      - name: Merge
        run: |
          set -euo pipefail
          mkdir -p shard-artifacts ui-results
          python3 tellomi/uitest/android/scripts/merge_results.py \
            --plan plan/plan.json \
            --shards shard-artifacts \
            --out ui-results
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("ui-results/ui-results.json").read_text())
          print(json.dumps(report["summary"], indent=2))
          PY

      - name: Upload merged results
        uses: actions/upload-artifact@v7
        with:
          name: ui-results
          path: ui-results
          if-no-files-found: error
          retention-days: 14
