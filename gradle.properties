#Sat Mar 12 05:53:50 MSK 2016
# Manifest versionCode = APP_VERSION_CODE * 10 + abiVersionCode.
# afat (the installed universal package) uses 9, so 14.0.10 is 1804699.
# bundleAfat uses 1, so that variant is 1804691. This build has no abi digit 0,
# so 1804690 is not a package. 1804689 was 14.0.9 afat (180468 * 10 + 9).
# A publish=release still reads android/latest.json and moves one decade above
# that code when the feed is already at or past this value.
APP_VERSION_CODE=180469
APP_VERSION_NAME=14.0.10
APP_PACKAGE=app.tellomi.chat
TELLOMI_LINK_HOST=tell.cc
TELLOMI_LINK_SCHEME=tellomi
TELLOMI_REBRAND_STRINGS=true
TELLOMI_API_ID=1
TELLOMI_API_HASH=0123456789abcdef0123456789abcdef
TELLOMI_CUSTOM_BACKEND=true
TELLOMI_USE_CLOUD_STRINGS=true
TELLOMI_DEFAULT_DC_ID=1
TELLOMI_LOCK_DC_ADDRESSES=false
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true
