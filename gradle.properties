APP_VERSION_CODE=7237
APP_VERSION_NAME=14.0.2
APP_PACKAGE=app.tellomi.chat
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true

# Tellomi server and branding. See docs/TELLOMI.md.
# Profiles (dcId:host:port). Debug builds use "dev" unless TELLOMI_SERVER_PROFILE
# is set. Release and every other non-debug build type always embed "dev"
# (8.137.39.82:10443) and fail if the selection would be local or any other
# non-production DC. Set TELLOMI_DC_ADDRESSES to ignore the profile and use an
# explicit list (shippable builds still reject anything other than that DC).
# IPv6 hosts must be [bracketed].
#   ./gradlew :TMessagesProj_App:assembleAfatDebug -PTELLOMI_SERVER_PROFILE=local
#   ./gradlew :TMessagesProj_App:assembleAfatDebug -PTELLOMI_SERVER_PROFILE=dev
#   ./gradlew :TMessagesProj_App:assembleAfatRelease
# DC addresses must be IP literals. ConnectionSocket::openConnection uses
# inet_pton and drops a hostname ("bad ipv4"). api.tellomi.cn is DNS-only and
# currently resolves to 8.137.39.82; do not put the name in TELLOMI_PROFILE_DEV.
TELLOMI_APP_NAME=Tellomi
# Public link host and custom scheme. DC addresses cannot be hostnames; this is separate.
TELLOMI_LINK_HOST=tell.cc
TELLOMI_LINK_SCHEME=tellomi
TELLOMI_API_ID=1
TELLOMI_API_HASH=0123456789abcdef0123456789abcdef
TELLOMI_PROFILE_DEV=1:8.137.39.82:10443,2:8.137.39.82:10443
TELLOMI_PROFILE_LOCAL=1:10.0.2.2:10443,2:10.0.2.2:10443
TELLOMI_DEFAULT_DC_ID=1
TELLOMI_CUSTOM_BACKEND=true
TELLOMI_LOCK_DC_ADDRESSES=true
TELLOMI_USE_CLOUD_STRINGS=false
TELLOMI_CHECK_UPDATES=false
TELLOMI_BILLING_UNAVAILABLE=true
TELLOMI_REBRAND_STRINGS=true
TELLOMI_DOWNLOAD_URL=https://tellomi.app
# Optional one-line override of TMessagesProj/config/tellomi-server-public.pem.
# In this file write newlines as the two characters \n (properties escape).
# TELLOMI_SERVER_PUBLIC_KEY=-----BEGIN RSA PUBLIC KEY-----\\n...\\n-----END RSA PUBLIC KEY-----
