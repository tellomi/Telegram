## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx10248m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7237
APP_VERSION_NAME=13.1.1
APP_PACKAGE=com.tellomi.app
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.enableResourceOptimizations=true
org.gradle.tooling.parallel=true

# Tellomi server and branding. See docs/TELLOMI.md.
# Local Teamgram docker: gnetway publishes TCP 10443. 10.0.2.2 is the Android
# emulator alias for the host. A physical device needs the host LAN IP instead.
# Format: dcId:host:port[,dcId:host:port...]  IPv6 hosts must be [bracketed].
TELLOMI_APP_NAME=Tellomi
TELLOMI_API_ID=1
TELLOMI_API_HASH=0123456789abcdef0123456789abcdef
TELLOMI_DC_ADDRESSES=1:10.0.2.2:10443,2:10.0.2.2:10443
TELLOMI_DEFAULT_DC_ID=1
TELLOMI_CUSTOM_BACKEND=true
TELLOMI_LOCK_DC_ADDRESSES=true
TELLOMI_USE_CLOUD_STRINGS=false
TELLOMI_CHECK_UPDATES=false
TELLOMI_BILLING_UNAVAILABLE=true
TELLOMI_REBRAND_STRINGS=true
TELLOMI_DOWNLOAD_URL=https://tellomi.app
# Optional one-line override of TMessagesProj/config/tellomi-server-public.pem.
# In this file write newlines as the two characters \n (properties escape).
# TELLOMI_SERVER_PUBLIC_KEY=-----BEGIN RSA PUBLIC KEY-----\\n...\\n-----END RSA PUBLIC KEY-----
