appId: app.tellomi.chat
tags:
  - A-MOMENT-042
  - A-MOMENT-043
  - A-MOMENT-046
  - A-MOMENT-047
  - A-MOMENT-048
  - A-MOMENT-049
---
- runFlow: sub/open-feed.yaml
- tapOn:
    text: "发布|Publish"
- extendedWaitUntil:
    visible:
      text: "新动态|New post|写点什么|What's new"
    timeout: 20000
- tapOn:
    text: "写点什么|What's new\\?"
- inputText: "uitest"
- hideKeyboard
- pressKey: back
- extendedWaitUntil:
    visible:
      text: "保存这份草稿|Save this draft|放弃|Discard"
    timeout: 15000
- takeScreenshot: composer-draft
